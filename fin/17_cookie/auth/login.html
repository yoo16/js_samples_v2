<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <title>Mini Cookie Auth</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
    <main id="main" class="min-h-screen px-4 py-8 sm:px-6 lg:px-8">
        <div class="mx-auto grid min-h-[calc(100vh-4rem)] w-full max-w-6xl items-center gap-6 lg:grid-cols-[0.9fr_1.1fr]">
            <section class="space-y-6">
                <div>
                    <p class="text-sm font-semibold uppercase tracking-wider text-sky-700">Cookie Auth Lab</p>
                    <h1 class="mt-3 text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl">Cookie + HttpOnly 認証</h1>
                    <p class="mt-4 max-w-xl text-sm leading-6 text-slate-600">
                        PHP セッションと CSRF トークンを使ったログインの動きを、ブラウザの Cookie と API レスポンスで確認します。
                    </p>
                </div>

                <div class="grid gap-3 text-sm sm:grid-cols-3 lg:grid-cols-1">
                    <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                        <p class="font-semibold text-slate-900">Cookie</p>
                        <p class="mt-1 text-slate-600">HttpOnly の有無で JavaScript からの参照可否が変わります。</p>
                    </div>
                    <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                        <p class="font-semibold text-slate-900">Session</p>
                        <p class="mt-1 text-slate-600">PHP セッション ID は <span class="font-mono text-xs">sid</span> に保存します。</p>
                    </div>
                    <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                        <p class="font-semibold text-slate-900">Fetch</p>
                        <p class="mt-1 text-slate-600"><span class="font-mono text-xs">credentials</span> で認証情報の送信範囲を制御します。</p>
                    </div>
                </div>
            </section>

            <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70">
                <div class="border-b border-slate-200 px-6 py-5">
                    <div class="flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between">
                        <div>
                            <p class="text-sm font-medium text-slate-500">Sign in</p>
                            <h2 class="text-xl font-semibold tracking-tight text-slate-950">テストユーザーでログイン</h2>
                        </div>
                        <span class="inline-flex w-fit rounded-full bg-emerald-50 px-3 py-1 text-xs font-medium text-emerald-700">CSRF ready</span>
                    </div>
                </div>

                <div class="space-y-6 p-6">
                    <div class="grid gap-5 lg:grid-cols-2">
                        <div class="space-y-2">
                            <label for="email" class="block text-sm font-medium text-slate-700">メールアドレス</label>
                            <input id="email" type="email" placeholder="email" value="test@test.com"
                                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-950 shadow-sm outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
                                autocomplete="username" />
                        </div>

                        <div class="space-y-2">
                            <label for="password" class="block text-sm font-medium text-slate-700">パスワード</label>
                            <input id="password" type="password" placeholder="password" value="secret123"
                                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-950 shadow-sm outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
                                autocomplete="current-password" />
                        </div>
                    </div>

                    <div class="grid gap-3 sm:grid-cols-[1fr_auto_auto]">
                        <button id="login"
                            class="inline-flex min-h-11 items-center justify-center rounded-lg bg-sky-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-sky-600/20 transition hover:bg-sky-700 focus:outline-none focus:ring-4 focus:ring-sky-100">
                            Login
                        </button>
                        <button id="me"
                            class="inline-flex min-h-11 items-center justify-center rounded-lg border border-slate-300 bg-white px-5 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100">
                            /me
                        </button>
                        <button id="logout"
                            class="inline-flex min-h-11 items-center justify-center rounded-lg border border-rose-200 bg-rose-50 px-5 py-2 text-sm font-medium text-rose-700 transition hover:bg-rose-100 focus:outline-none focus:ring-4 focus:ring-rose-100">
                            Logout
                        </button>
                    </div>

                    <div>
                        <label for="csrf-token" class="block text-sm font-medium text-slate-700">CSRFトークン</label>
                        <span id="csrf-token" class="text-xs text-slate-500"></span>
                    </div>
                    <div class="min-w-0 space-y-2">
                        <label class="block text-sm font-medium text-slate-700">レスポンス</label>
                        <pre id="out"
                            class="h-80 max-w-full overflow-auto whitespace-pre rounded-lg border border-slate-200 bg-slate-950 p-4 text-xs leading-relaxed text-slate-100 shadow-inner"></pre>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 分離したJS（そのまま） -->
    <script src="./js/auth.js" defer></script>
</body>

</html>
