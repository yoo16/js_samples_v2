<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カフェ注文アプリ - ESModule練習</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen py-10">
  <main class="max-w-3xl mx-auto px-4">
    <h1 class="text-3xl font-bold text-amber-900 mb-6">Cafe ESM</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- メニュー一覧 -->
      <section class="bg-white rounded-lg shadow p-5">
        <h2 class="text-lg font-bold text-gray-800 mb-4">メニュー</h2>
        <ul id="menu-list" class="space-y-3"></ul>
      </section>

      <!-- 注文内容 -->
      <section class="bg-white rounded-lg shadow p-5">
        <h2 class="text-lg font-bold text-gray-800 mb-4">注文内容</h2>
        <ul id="cart-list" class="space-y-2 mb-4"></ul>
        <div class="border-t pt-3 flex justify-between items-center">
          <span class="text-gray-600">合計</span>
          <span id="total" class="text-2xl font-bold text-amber-700">0円</span>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
