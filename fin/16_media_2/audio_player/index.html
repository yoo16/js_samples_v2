<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white">
    <main class="my-3 mx-auto flex w-full max-w-5xl items-center">
        <section class="grid w-full gap-5 lg:grid-cols-[minmax(0,1fr)_21rem]">
            <div class="rounded-3xl border border-white/10 bg-white/[0.06] p-5 shadow-2xl shadow-black/30 backdrop-blur">

                <!-- Track Info -->
                <section class="flex items-start justify-between gap-4">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-[0.28em] text-cyan-300">Now Playing</p>
                        <h1 id="trackTitle" class="mt-3 text-3xl font-black tracking-tight">Music 1</h1>
                        <p id="trackArtist" class="mt-2 text-sm font-semibold text-slate-300">Audio Track</p>
                    </div>
                    <div class="relative h-32 w-32 shrink-0 overflow-hidden rounded-2xl bg-cyan-300 shadow-lg shadow-cyan-500/20">
                        <img id="albumCover" alt="" class="hidden h-full w-full object-cover">
                        <div id="coverFallback" class="grid h-full w-full place-items-center text-3xl font-black text-slate-950">
                        </div>
                    </div>
                </section>

                <!-- Visualizer -->
                <section class="overflow-hidden rounded-2xl bg-slate-900/80 p-4">
                    <div id="visualizer" class="flex h-32 items-end justify-center gap-1.5">
                        <span class="visual-bar h-8 w-2 rounded-full bg-cyan-300/80"></span>
                        <span class="visual-bar h-14 w-2 rounded-full bg-fuchsia-300/80"></span>
                        <span class="visual-bar h-20 w-2 rounded-full bg-cyan-300/80"></span>
                        <span class="visual-bar h-10 w-2 rounded-full bg-violet-300/80"></span>
                        <span class="visual-bar h-24 w-2 rounded-full bg-cyan-300/80"></span>
                        <span class="visual-bar h-16 w-2 rounded-full bg-fuchsia-300/80"></span>
                        <span class="visual-bar h-28 w-2 rounded-full bg-cyan-300/80"></span>
                        <span class="visual-bar h-12 w-2 rounded-full bg-violet-300/80"></span>
                        <span class="visual-bar h-20 w-2 rounded-full bg-cyan-300/80"></span>
                        <span class="visual-bar h-10 w-2 rounded-full bg-fuchsia-300/80"></span>
                        <span class="visual-bar h-24 w-2 rounded-full bg-cyan-300/80"></span>
                        <span class="visual-bar h-14 w-2 rounded-full bg-violet-300/80"></span>
                    </div>
                </section>

                <!-- Progress Bar -->
                <div class="mt-7">
                    <input id="progressBar" type="range" min="0" max="100" value="0" step="0.1"
                        class="h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-700 accent-cyan-300">
                    <div class="mt-2 flex justify-between text-xs font-bold text-slate-400">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <!-- Playback Controls -->
                <section class="mt-6 flex items-center justify-center gap-3">
                    <button id="shuffleBtn" type="button"
                        class="h-11 w-11 rounded-full border border-white/10 bg-white/10 text-sm font-black text-slate-200 transition hover:bg-white/15">
                        SH
                    </button>
                    <button id="prevBtn" type="button"
                        class="h-12 w-12 rounded-full border border-white/10 bg-white/10 text-xl font-black transition hover:bg-white/15">
                        ‹
                    </button>
                    <button id="playBtn" type="button"
                        class="h-16 w-16 rounded-full bg-cyan-300 text-2xl font-black text-slate-950 shadow-lg shadow-cyan-500/25 transition hover:bg-cyan-200">
                        ▶
                    </button>
                    <button id="nextBtn" type="button"
                        class="h-12 w-12 rounded-full border border-white/10 bg-white/10 text-xl font-black transition hover:bg-white/15">
                        ›
                    </button>
                    <button id="repeatBtn" type="button"
                        class="h-11 w-11 rounded-full border border-white/10 bg-white/10 text-sm font-black text-slate-200 transition hover:bg-white/15">
                        RP
                    </button>
                </section>

                <!-- Volume and Speed Controls -->
                <div class="mt-7 grid gap-4 sm:grid-cols-2">
                    <label class="block">
                        <span class="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">Volume</span>
                        <input id="volumeBar" type="range" min="0" max="1" value="0.8" step="0.01"
                            class="mt-2 h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-700 accent-cyan-300">
                    </label>
                    <label class="block">
                        <span class="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">Speed</span>
                        <select id="speedSelect"
                            class="mt-2 w-full rounded-full border border-white/10 bg-slate-900 px-4 py-2 text-sm font-bold text-white outline-none focus:border-cyan-300">
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>1.00x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.50x</option>
                            <option value="2">2.00x</option>
                        </select>
                    </label>
                </div>
            </div>

            <!-- Playlist -->
            <aside class="rounded-3xl border border-white/10 bg-white/[0.06] p-4 shadow-2xl shadow-black/20 backdrop-blur">
                <div class="mb-4 flex items-center justify-between">
                    <h2 class="text-sm font-black uppercase tracking-[0.2em] text-slate-200">Playlist</h2>
                    <span id="trackCount" class="rounded-full bg-white/10 px-3 py-1 text-xs font-bold text-slate-300">3</span>
                </div>
                <div id="playlist" class="space-y-2"></div>
            </aside>
        </section>
    </main>

    <audio id="audio"></audio>
    <script src="js/app.js" defer></script>
</body>

</html>
