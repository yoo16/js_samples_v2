<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaPipe - Hand Landmark Detection</title>
  <!-- Tailwind CSS（vendor/ 内の standalone ビルドを利用）-->
  <script src="../vendor/tailwindcss/tailwindcss.js"></script>
  <!-- MediaPipe Tasks Vision（vendor/ 内のファイルを利用） -->
  <script type="importmap">
    {
      "imports": {
        "@mediapipe/tasks-vision": "../vendor/@mediapipe/tasks-vision/vision_bundle.mjs"
      }
    }
  </script>
</head>

<body class="min-h-screen bg-gradient-to-b from-slate-100 to-slate-200 text-slate-800">
  <main class="mx-auto flex max-w-5xl flex-col gap-8 px-4 py-10">

    <header class="text-center">
      <p class="text-sm font-semibold uppercase tracking-widest text-indigo-500">MediaPipe Tasks Vision</p>
      <h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">指・手のランドマーク検出</h1>
      <p class="mt-2 text-sm text-slate-500">
        HandLandmarker が手ごとに 21 個の関節を推定します。骨格・番号・伸びている指を可視化します。
      </p>
    </header>

    <div class="grid gap-8 lg:grid-cols-[minmax(0,1fr)_20rem]">

      <!-- 左：カメラ映像 -->
      <section class="flex flex-col gap-4">
        <figure
          class="relative aspect-[4/3] w-full overflow-hidden rounded-2xl bg-slate-900 shadow-xl ring-1 ring-slate-900/10">
          <video id="video" class="absolute inset-0 h-full w-full -scale-x-100 object-cover" autoplay muted playsinline
            loop></video>
          <canvas id="canvas" width="640" height="480"
            class="pointer-events-none absolute inset-0 h-full w-full -scale-x-100"></canvas>
          <figcaption
            class="absolute bottom-3 left-3 flex items-center gap-2 rounded-full bg-slate-900/60 px-3 py-1 text-xs font-medium text-white backdrop-blur">
            <span id="live-dot" class="h-2 w-2 rounded-full bg-slate-400"></span>
            <span id="live-label">待機中</span>
          </figcaption>
        </figure>

        <div class="flex flex-wrap gap-4 text-sm text-slate-600">
          <label class="flex items-center gap-2">
            <input id="toggle-skeleton" type="checkbox" checked
              class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
            骨格を表示
          </label>
          <label class="flex items-center gap-2">
            <input id="toggle-index" type="checkbox"
              class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
            ランドマーク番号を表示
          </label>
        </div>
      </section>

      <!-- 右：ステータス -->
      <aside class="flex flex-col gap-6">

        <div class="rounded-2xl bg-white/70 p-4 shadow-sm ring-1 ring-slate-900/5 backdrop-blur">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">検出ステータス</h2>
          <dl class="mt-3 space-y-2 text-sm">
            <div class="flex justify-between"><dt class="text-slate-500">検出した手</dt>
              <dd id="stat-hands" class="font-mono font-semibold text-slate-700">0</dd>
            </div>
            <div class="flex justify-between"><dt class="text-slate-500">立てている指</dt>
              <dd id="stat-fingers" class="font-mono font-semibold text-slate-700">0</dd>
            </div>
            <div class="flex justify-between"><dt class="text-slate-500">処理速度</dt>
              <dd id="stat-fps" class="font-mono font-semibold text-slate-700">0 fps</dd>
            </div>
          </dl>
        </div>

        <!-- 手ごとの詳細（動的生成） -->
        <div id="hand-details" class="flex flex-col gap-4"></div>

        <p class="text-xs text-slate-400">
          映像は左右反転して表示しています。番号は MediaPipe Hand の 21 点トポロジー（0:手首 〜 20:小指先端）です。
        </p>
      </aside>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>

</html>
