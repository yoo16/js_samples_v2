<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaPipe - Pose Landmark Detection</title>
  <!-- Tailwind CSS（vendor/ 内の standalone ビルドを利用）-->
  <script src="../vendor/tailwindcss/tailwindcss.js"></script>
  <!-- MediaPipe Tasks Vision（vendor/ 内のファイルを利用） -->
  <script type="importmap">
    {
      "imports": {
        "@mediapipe/tasks-vision": "../vendor/@mediapipe/tasks-vision/vision_bundle.mjs"
      }
    }
  </script>
</head>

<body class="min-h-screen bg-gradient-to-b from-slate-100 to-slate-200 text-slate-800">
  <main class="mx-auto flex max-w-5xl flex-col gap-8 px-4 py-10">

    <!-- ヘッダー -->
    <header class="text-center">
      <h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">体のランドマーク検出</h1>
      <p class="mt-2 text-sm text-slate-500">
        PoseLandmarker が推定する 33 個の特徴点のうち、選択した部位の点と番号を可視化します。
      </p>
    </header>

    <div class="grid gap-8 lg:grid-cols-[minmax(0,1fr)_20rem]">

      <!-- 左：カメラ映像 -->
      <section class="flex flex-col gap-4">
        <figure
          class="relative aspect-[4/3] w-full overflow-hidden rounded-2xl bg-slate-900 shadow-xl ring-1 ring-slate-900/10">
          <video id="video" class="absolute inset-0 h-full w-full object-cover" autoplay muted playsinline loop></video>
          <canvas id="canvas" width="640" height="480" class="pointer-events-none absolute inset-0 h-full w-full"></canvas>
          <figcaption
            class="absolute bottom-3 left-3 flex items-center gap-2 rounded-full bg-slate-900/60 px-3 py-1 text-xs font-medium text-white backdrop-blur">
            <span id="live-dot" class="h-2 w-2 rounded-full bg-slate-400"></span>
            <span id="live-label">待機中</span>
          </figcaption>
        </figure>

        <!-- 表示オプション -->
        <label class="flex items-center gap-2 text-sm text-slate-600">
          <input id="toggle-index" type="checkbox"
            class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
          ランドマーク番号をキャンバスに表示
        </label>
      </section>

      <!-- 右：ステータス & コントロール -->
      <aside class="flex flex-col gap-6">

        <!-- 検出ステータス -->
        <div class="rounded-2xl bg-white/70 p-4 shadow-sm ring-1 ring-slate-900/5 backdrop-blur">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">検出ステータス</h2>
          <dl class="mt-3 space-y-2 text-sm">
            <div class="flex justify-between"><dt class="text-slate-500">体の検出</dt>
              <dd id="stat-pose" class="font-semibold text-slate-400">—</dd>
            </div>
            <div class="flex justify-between"><dt class="text-slate-500">総ランドマーク数</dt>
              <dd id="stat-total" class="font-mono font-semibold text-slate-700">0</dd>
            </div>
            <div class="flex justify-between"><dt class="text-slate-500">表示中の点数</dt>
              <dd id="stat-count" class="font-mono font-semibold text-slate-700">0</dd>
            </div>
            <div class="flex justify-between"><dt class="text-slate-500">処理速度</dt>
              <dd id="stat-fps" class="font-mono font-semibold text-slate-700">0 fps</dd>
            </div>
          </dl>
        </div>

        <!-- 部位ボタン -->
        <div class="rounded-2xl bg-white/70 p-4 shadow-sm ring-1 ring-slate-900/5 backdrop-blur">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">部位を選択</h2>
          <div id="part-buttons" class="mt-3 flex flex-wrap gap-2"></div>
        </div>

        <!-- ランドマーク番号一覧 -->
        <div class="rounded-2xl bg-white/70 p-4 shadow-sm ring-1 ring-slate-900/5 backdrop-blur">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">
            <span id="index-title">ランドマーク番号</span>
          </h2>
          <p class="mt-1 text-xs text-slate-400">クリックでその点をキャンバス上で強調</p>
          <div id="index-list" class="mt-3 flex flex-wrap gap-1.5"></div>
        </div>
      </aside>
    </div>

    <p class="text-center text-xs text-slate-400">
      映像は端末内で処理され、外部へ送信されません。「左・右」は映っている本人から見た左右です（映像は反転していません）。
    </p>
  </main>

  <script type="module" src="js/main.js"></script>
</body>

</html>
