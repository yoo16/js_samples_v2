<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Recorder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl items-center px-4 py-8">
        <section class="w-full rounded-3xl border border-white/10 bg-white/[0.06] p-5 shadow-2xl shadow-black/30 backdrop-blur sm:p-8">
            <div class="flex flex-col gap-6 sm:flex-row sm:items-start sm:justify-between">
                <div>
                    <p class="text-xs font-bold uppercase tracking-[0.28em] text-cyan-300">Web Audio API</p>
                    <h1 class="mt-3 text-4xl font-black tracking-tight">Voice Recorder</h1>
                    <div class="mt-4 flex items-center gap-3">
                        <span id="status-dot" class="h-3 w-3 rounded-full bg-slate-500 shadow-lg"></span>
                        <div id="console" class="text-sm font-semibold text-slate-300"></div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <p id="timer" class="text-2xl font-black tabular-nums text-slate-300">00:00</p>
                    <button id="record-toggle" type="button"
                        class="inline-flex h-12 items-center justify-center rounded-full bg-rose-500 px-6 text-sm font-black text-white shadow-lg shadow-rose-500/25 transition hover:bg-rose-400">
                        Record
                    </button>
                </div>
            </div>

            <!-- 録音中の入力レベル表示 -->
            <div id="meter-shell" class="mt-8 rounded-2xl border border-white/10 bg-slate-900/80 p-5">
                <div class="mb-5 flex items-end justify-between gap-4">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Input Level</p>
                        <p id="level-label" class="mt-2 text-4xl font-black tabular-nums">0%</p>
                    </div>
                    <p id="peak-label" class="text-right text-xs font-bold uppercase tracking-[0.16em] text-slate-400">
                        Peak 0%
                    </p>
                </div>

                <div class="h-4 overflow-hidden rounded-full bg-slate-800 shadow-inner shadow-black/30">
                    <div id="level-fill"
                        class="h-full w-0 rounded-full bg-emerald-400 shadow-lg transition-[width] duration-75">
                    </div>
                </div>

                <div id="level-bars" class="mt-7 grid h-36 grid-cols-[repeat(24,minmax(0,1fr))] items-end gap-1.5" aria-hidden="true"></div>

                <progress id="input-level" max="100" value="0" class="sr-only"></progress>
            </div>

            <!-- 録音後の波形プレビューと再生 -->
            <div id="playback-shell" hidden class="mt-6 rounded-2xl border border-white/10 bg-slate-900/80 p-5">
                <p class="mb-3 text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Recorded Waveform</p>
                <canvas id="waveform" class="h-28 w-full rounded-xl bg-slate-950" width="800" height="112"></canvas>

                <div class="mt-5 flex flex-wrap items-center gap-4">
                    <audio id="playback" controls class="h-10 flex-1 min-w-[200px]"></audio>
                    <a id="download-link" download="recording.webm"
                        class="inline-flex h-10 items-center justify-center rounded-full border border-white/15 px-5 text-xs font-bold uppercase tracking-[0.14em] text-slate-200 transition hover:bg-white/10">
                        Download
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
