<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Bass Synth</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 白鍵・黒鍵の配置は絶対配置で組む定番のピアノCSS */
        #keyboard {
            position: relative;
            height: 160px;
        }

        .white-key {
            position: relative;
            flex: 1 0 auto;
            border: 1px solid rgba(15, 23, 42, 0.4);
        }

        .black-key {
            position: absolute;
            top: 0;
            width: 34px;
            height: 96px;
            margin-left: -17px;
            z-index: 10;
        }

        .key-label {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-950 text-white">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl items-center px-4 py-8">
        <section class="w-full rounded-3xl border border-white/10 bg-white/[0.06] p-5 shadow-2xl shadow-black/30 backdrop-blur sm:p-8">
            <div class="flex flex-col gap-6 sm:flex-row sm:items-start sm:justify-between">
                <div>
                    <p class="text-xs font-bold uppercase tracking-[0.28em] text-amber-300">Web Audio API</p>
                    <h1 class="mt-3 text-4xl font-black tracking-tight">Analog Bass Synth</h1>
                    <div class="mt-4 flex items-center gap-3">
                        <span id="status-dot" class="h-3 w-3 rounded-full bg-slate-500 shadow-lg"></span>
                        <div id="console" class="text-sm font-semibold text-slate-300"></div>
                    </div>
                </div>
            </div>

            <!-- パラメーターコントロール -->
            <div class="mt-8 grid grid-cols-2 gap-x-6 gap-y-5 rounded-2xl border border-white/10 bg-slate-900/80 p-5 sm:grid-cols-4">
                <div>
                    <label for="waveform" class="text-xs font-bold uppercase tracking-[0.14em] text-slate-400">Waveform</label>
                    <select id="waveform"
                        class="mt-2 w-full rounded-lg border border-white/10 bg-slate-800 px-2 py-1.5 text-sm text-white">
                        <option value="sawtooth" selected>Sawtooth</option>
                        <option value="square">Square</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 pt-6">
                    <input id="sub-osc" type="checkbox" checked
                        class="h-4 w-4 rounded border-white/20 bg-slate-800 text-amber-400 focus:ring-amber-400">
                    <label for="sub-osc" class="text-xs font-bold uppercase tracking-[0.14em] text-slate-400">Sub Osc
                        (-1oct)</label>
                </div>

                <div class="col-span-2"></div>

                <div>
                    <label for="cutoff" class="flex justify-between text-xs font-bold uppercase tracking-[0.14em] text-slate-400">
                        <span>Cutoff</span><span id="cutoff-value" class="tabular-nums text-slate-300">400 Hz</span>
                    </label>
                    <input id="cutoff" type="range" min="100" max="3000" value="400" step="1" class="mt-2 w-full accent-amber-400">
                </div>

                <div>
                    <label for="resonance" class="flex justify-between text-xs font-bold uppercase tracking-[0.14em] text-slate-400">
                        <span>Resonance</span><span id="resonance-value" class="tabular-nums text-slate-300">12</span>
                    </label>
                    <input id="resonance" type="range" min="0" max="24" value="12" step="0.5" class="mt-2 w-full accent-amber-400">
                </div>

                <div>
                    <label for="env-amount" class="flex justify-between text-xs font-bold uppercase tracking-[0.14em] text-slate-400">
                        <span>Filter Env</span><span id="env-amount-value" class="tabular-nums text-slate-300">3000 Hz</span>
                    </label>
                    <input id="env-amount" type="range" min="0" max="6000" value="3000" step="10" class="mt-2 w-full accent-amber-400">
                </div>

                <div>
                    <label for="filter-decay" class="flex justify-between text-xs font-bold uppercase tracking-[0.14em] text-slate-400">
                        <span>Filter Decay</span><span id="filter-decay-value" class="tabular-nums text-slate-300">220 ms</span>
                    </label>
                    <input id="filter-decay" type="range" min="30" max="1000" value="220" step="10" class="mt-2 w-full accent-amber-400">
                </div>

                <div>
                    <label for="attack" class="flex justify-between text-xs font-bold uppercase tracking-[0.14em] text-slate-400">
                        <span>Amp Attack</span><span id="attack-value" class="tabular-nums text-slate-300">5 ms</span>
                    </label>
                    <input id="attack" type="range" min="1" max="300" value="5" step="1" class="mt-2 w-full accent-amber-400">
                </div>

                <div>
                    <label for="release" class="flex justify-between text-xs font-bold uppercase tracking-[0.14em] text-slate-400">
                        <span>Amp Release</span><span id="release-value" class="tabular-nums text-slate-300">180 ms</span>
                    </label>
                    <input id="release" type="range" min="30" max="1000" value="180" step="10" class="mt-2 w-full accent-amber-400">
                </div>

                <div>
                    <label for="glide" class="flex justify-between text-xs font-bold uppercase tracking-[0.14em] text-slate-400">
                        <span>Glide</span><span id="glide-value" class="tabular-nums text-slate-300">60 ms</span>
                    </label>
                    <input id="glide" type="range" min="0" max="300" value="60" step="5" class="mt-2 w-full accent-amber-400">
                </div>
            </div>

            <!-- 鍵盤（マウス操作 & PCキーボード操作の両対応） -->
            <div class="mt-6 rounded-2xl border border-white/10 bg-slate-900/80 p-5">
                <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
                    <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">
                        Keyboard: A S D F G H J K L ; (white) / W E T Y U O P (black)
                    </p>
                    <div class="flex items-center gap-3">
                        <button id="octave-down" type="button"
                            class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-white/15 text-sm font-black text-slate-200 transition hover:bg-white/10 disabled:opacity-30">
                            −
                        </button>
                        <p class="text-xs font-bold uppercase tracking-[0.14em] text-slate-300">
                            Octave <span id="octave-range" class="tabular-nums text-amber-300"></span>
                        </p>
                        <button id="octave-up" type="button"
                            class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-white/15 text-sm font-black text-slate-200 transition hover:bg-white/10 disabled:opacity-30">
                            +
                        </button>
                    </div>
                </div>
                <div id="keyboard" class="flex select-none"></div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
